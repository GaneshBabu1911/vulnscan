services:
  - type: web
    name: vulnscan-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: Admin@123456
      - key: FRONTEND_URL
        value: http://localhost:5173
      - key: AI_PROVIDER
        value: local
